<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>SmartWindow Settings — 03 · Displays in the sidebar</title>
<style>
  :root {
    color-scheme: dark;
    --accent: #0a84ff;
    --link: #64b0ff;
    --text: #f5f5f7;
    --text2: #b4b4b9;
    --text3: #9c9ca1;
    --win: #1e1e20;
    --side: #29292c;
    --group: #2c2c2e;
    --sep: rgba(255,255,255,.09);
    --focus: #8fd0ff;
    --custom: #74b9ff;
    --ok: #32d74b;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    width: 1280px; height: 820px; position: relative; overflow: hidden;
    font: 13px/1.38 var(--font); color: var(--text);
    background:
      radial-gradient(900px 520px at 18% 12%, rgba(88,86,214,.35), transparent 60%),
      radial-gradient(800px 600px at 88% 92%, rgba(10,132,255,.25), transparent 60%),
      linear-gradient(160deg, #15182a, #0e1018 60%, #141a24);
    -webkit-font-smoothing: antialiased;
  }
  button, input, select { font: inherit; color: inherit; }
  :focus { outline: none; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- Artboard chrome (not part of the app) ---------- */
  .board-label { position: absolute; left: 24px; top: 20px; font-size: 12px; color: #c9cbd6; }
  .board-label b { color: #fff; font-weight: 600; }
  .demo {
    position: absolute; right: 24px; top: 14px; display: flex; align-items: center; gap: 14px;
    padding: 6px 10px; border-radius: 10px; background: rgba(0,0,0,.45); border: 1px dashed rgba(255,255,255,.28);
    font-size: 12px; color: #d5d6dd;
  }
  .demo .tag { font-size: 10px; letter-spacing: .04em; text-transform: uppercase; color: #ffd27a; font-weight: 600; }
  .demo fieldset { border: 0; margin: 0; padding: 0; display: flex; align-items: center; gap: 8px; }
  .demo legend { float: left; padding: 0; margin-right: 8px; }

  /* ---------- Window ---------- */
  .window {
    position: absolute; left: 150px; top: 70px; width: 980px; height: 680px;
    display: grid; grid-template-columns: 240px 1fr; overflow: hidden;
    background: var(--win); border-radius: 12px;
    border: 1px solid rgba(255,255,255,.13);
    box-shadow: 0 30px 80px rgba(0,0,0,.55), 0 0 0 .5px rgba(0,0,0,.8);
  }
  .sidebar { background: var(--side); border-right: 1px solid rgba(0,0,0,.45); display: flex; flex-direction: column; min-height: 0; }
  .lights { height: 52px; flex: none; display: flex; gap: 8px; align-items: center; padding-left: 18px; }
  .lights span { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.3); }
  .lights span:nth-child(1) { background: #ff5f57; } .lights span:nth-child(2) { background: #febc2e; } .lights span:nth-child(3) { background: #28c840; }
  .side-scroll { overflow: auto; padding: 0 10px 14px; flex: 1; }
  .grp { margin: 10px 8px 4px; font-size: 11px; font-weight: 600; color: var(--text3); }
  .grp:first-child { margin-top: 2px; }
  .nav-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .nav {
    width: 100%; border: 0; background: transparent; text-align: left; cursor: default;
    display: grid; grid-template-columns: 24px 1fr auto; align-items: center; gap: 9px;
    padding: 5px 8px; border-radius: 7px; min-height: 30px;
  }
  .nav:hover { background: rgba(255,255,255,.06); }
  .nav[aria-current="page"] { background: #0059c7; }
  .nav .nm { display: block; font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nav .sb { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--text3); white-space: nowrap; }
  .nav[aria-current="page"] .sb { color: #dce9ff; }
  .nav .sb svg { width: 9px; height: 9px; flex: none; }
  .nav .badge {
    min-width: 20px; padding: 1px 6px; border-radius: 10px; font-size: 11px; font-weight: 600; text-align: center;
    background: rgba(10,132,255,.22); color: #a9d2ff; font-variant-numeric: tabular-nums;
  }
  .nav[aria-current="page"] .badge { background: rgba(255,255,255,.24); color: #fff; }
  .sq { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; color: #fff; box-shadow: inset 0 0 0 .5px rgba(255,255,255,.18); }
  .sq svg { width: 15px; height: 15px; }
  .sq.sm { width: 20px; height: 20px; border-radius: 5px; } .sq.sm svg { width: 13px; height: 13px; }
  .c-gray { background: linear-gradient(#9a9aa0, #636368); }
  .c-pink { background: linear-gradient(#ff6b93, #e0336b); }
  .c-blue { background: linear-gradient(#45a0ff, #0a6cff); }
  .c-indigo { background: linear-gradient(#8784ff, #5856d6); }
  .c-orange { background: linear-gradient(#ffad47, #f58300); }
  .c-teal { background: linear-gradient(#4fd6d1, #139c9c); }
  .c-slate { background: linear-gradient(#8593a8, #4b586d); }
  .c-green { background: linear-gradient(#4cd964, #24a33b); }
  .hint { display: flex; gap: 6px; margin: 8px 8px 2px; font-size: 11px; line-height: 1.4; color: var(--text3); }
  .hint svg { width: 12px; height: 12px; flex: none; margin-top: 1px; }

  /* ---------- Content ---------- */
  main { display: grid; grid-template-rows: 52px 1fr; min-height: 0; min-width: 0; position: relative; }
  .toolbar { display: flex; align-items: center; gap: 12px; padding: 0 28px; border-bottom: 1px solid rgba(0,0,0,.5); }
  .toolbar h1 { margin: 0; font-size: 15px; font-weight: 700; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .jump { display: flex; gap: 2px; }
  .jump button { border: 0; background: transparent; color: var(--text2); padding: 3px 8px; border-radius: 6px; font-size: 12px; cursor: default; }
  .jump button:hover { background: rgba(255,255,255,.08); color: var(--text); }
  .scope-tag { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--text2); padding: 3px 9px; border-radius: 10px; background: rgba(255,255,255,.07); }
  .scope-tag svg { width: 12px; height: 12px; }
  .scroll { position: relative; overflow: auto; padding: 0 28px 40px; min-height: 0; scroll-behavior: smooth; }

  .ident { display: grid; grid-template-columns: 48px 1fr auto; gap: 14px; align-items: center; padding: 20px 0 12px; }
  .ident-ic { width: 48px; height: 48px; border-radius: 11px; display: grid; place-items: center; color: #fff; }
  .ident-ic svg { width: 28px; height: 28px; }
  .ident .spec { font-size: 13px; color: var(--text); }
  .status { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text2); margin-top: 2px; }
  .status svg { width: 13px; height: 13px; flex: none; }
  .status.ok svg { color: var(--ok); }
  .status.off svg { color: #a1a1a6; }
  .summary {
    margin: 0 0 14px; padding: 10px 12px; border-radius: 9px; font-size: 12.5px; color: var(--text2);
    background: rgba(255,255,255,.045); border: 1px solid rgba(255,255,255,.06);
  }
  .summary strong { color: var(--text); font-weight: 600; }
  .summary .dot { margin-right: 6px; }

  .pv-wrap { margin: 0 0 6px; }
  .pv-cap { display: flex; justify-content: space-between; font-size: 11px; color: var(--text3); margin-bottom: 5px; }
  .pv { position: relative; height: 70px; border-radius: 9px; overflow: hidden;
        background: linear-gradient(120deg, #3a2a63, #1d3d6b 50%, #2d5d6b); border: 1px solid rgba(255,255,255,.08); }
  .pv-bar { position: absolute; inset: 0 0 auto 0; height: 20px; display: flex; align-items: center; gap: 6px; padding: 0 8px; font-size: 9.5px; color: #eee; }
  .pv-tab { padding: 1px 7px; border-radius: 4px; background: rgba(255,255,255,.12); white-space: nowrap; }
  .pv-tab.on { background: rgba(255,255,255,.26); }
  .pv-r { margin-left: auto; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .pw { display: inline-flex; align-items: center; gap: 2px; }
  .pw svg { width: 9px; height: 9px; }
  .pw-sep { width: 1px; height: 10px; background: rgba(255,255,255,.4); }
  .pv-notch { position: absolute; top: 0; left: 50%; transform: translateX(-50%); border-radius: 0 0 9px 9px; display: grid; place-items: center; box-shadow: 0 0 0 .5px rgba(255,255,255,.15); }
  .pv-ghost { position: absolute; top: 0; left: 50%; transform: translateX(-50%); border: 1px dashed rgba(255,255,255,.45); border-top: 0; border-radius: 0 0 11px 11px; }
  .pv-cam { width: 4px; height: 4px; border-radius: 50%; background: #2a2a40; box-shadow: 0 0 0 1px #111; }
  .pv-eq { display: flex; gap: 1px; align-items: flex-end; height: 7px; }
  .pv-eq i { width: 2px; background: #fff; border-radius: 1px; }

  .sec { margin-top: 6px; }
  .sec-h {
    position: sticky; top: 0; z-index: 5; margin: 0; padding: 16px 0 9px; background: var(--win);
    display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700;
    box-shadow: 0 1px 0 rgba(0,0,0,.0);
  }
  .sec-h .cnt { margin-left: auto; font-size: 11.5px; font-weight: 500; color: var(--custom); display: inline-flex; align-items: center; gap: 5px; }
  .sub-h { margin: 18px 0 7px; font-size: 13px; font-weight: 700; }
  .sub-h.small { margin: 14px 2px 6px; font-size: 12px; font-weight: 600; color: var(--text2); }
  .group { background: var(--group); border-radius: 10px; border: 1px solid rgba(255,255,255,.05); }
  .row { display: flex; align-items: center; gap: 14px; padding: 9px 14px; min-height: 44px; }
  .row + .row, .row + .wlist, .wlist + .row { border-top: 1px solid var(--sep); }
  .row.dim .t, .row.dim .d { opacity: .55; }
  .lbl { flex: 1; min-width: 0; }
  .t { display: block; font-size: 13px; color: var(--text); }
  .d { display: block; font-size: 11.5px; color: var(--text2); margin-top: 1px; }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; margin-top: 3px; font-size: 11.5px; }
  .meta:empty { display: none; }
  .inh { color: var(--text3); }
  .cust { color: var(--custom); display: inline-flex; align-items: center; gap: 5px; font-weight: 600; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }
  .ovr-lbl { color: var(--text3); }
  .ovr {
    border: 0; display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px 1px 5px; border-radius: 9px;
    background: rgba(10,132,255,.16); color: #b9dcff; font-size: 11.5px; cursor: default;
  }
  .ovr:hover { background: rgba(10,132,255,.28); }
  .ovr svg { width: 11px; height: 11px; }
  .reset {
    width: 22px; height: 22px; border-radius: 50%; border: 0; background: rgba(255,255,255,.08); color: var(--text2);
    display: inline-grid; place-items: center; cursor: default;
  }
  .reset:hover { background: rgba(255,255,255,.16); color: var(--text); }
  .reset svg { width: 12px; height: 12px; }
  .note { font-size: 11.5px; color: var(--text2); margin: 7px 4px 0; display: flex; gap: 6px; }
  .note svg { width: 13px; height: 13px; flex: none; margin-top: 1px; }

  /* controls */
  input[role="switch"] {
    appearance: none; -webkit-appearance: none; margin: 0; flex: none;
    width: 38px; height: 22px; border-radius: 11px; background: #55555a; position: relative; cursor: default;
    transition: background .15s;
  }
  input[role="switch"]::before {
    content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff;
    box-shadow: 0 1px 2px rgba(0,0,0,.35); transition: transform .15s;
  }
  input[role="switch"]:checked { background: var(--accent); }
  input[role="switch"]:checked::before { transform: translateX(16px); }
  input[role="switch"]:disabled { opacity: .4; }
  input[role="switch"]:focus-visible { outline-offset: 3px; border-radius: 13px; }
  input[type="checkbox"]:not([role]) { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }

  .slider { display: flex; align-items: center; gap: 10px; flex: none; width: 270px; }
  .slider output { min-width: 58px; text-align: right; font-variant-numeric: tabular-nums; color: var(--text); }
  input[type="range"] {
    -webkit-appearance: none; appearance: none; flex: 1; height: 22px; background: transparent; margin: 0; --p: 50%;
  }
  input[type="range"]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--accent) var(--p), rgba(255,255,255,.2) var(--p)); }
  input[type="range"]::-moz-range-track { height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--accent) var(--p), rgba(255,255,255,.2) var(--p)); }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; margin-top: -7px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.45); }
  input[type="range"]::-moz-range-thumb { width: 18px; height: 18px; border: 0; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.45); }
  input[type="range"]:disabled { opacity: .4; }
  input[type="range"]:focus-visible { outline-offset: 1px; }

  .seg { display: inline-flex; border: 0; margin: 0; padding: 2px; border-radius: 7px; background: rgba(255,255,255,.09); flex: none; }
  .seg legend { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .seg input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; }
  .seg label { padding: 3px 12px; border-radius: 5px; font-size: 12px; color: var(--text2); cursor: default; white-space: nowrap; }
  .seg input:checked + label { background: #68686e; color: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
  .seg input:focus-visible + label { outline: 2px solid var(--focus); outline-offset: 1px; }
  .seg input:disabled + label { opacity: .45; }

  .btn { border: 0; border-radius: 6px; padding: 4px 11px; background: #505055; color: #fff; font-size: 12.5px; cursor: default; white-space: nowrap; flex: none; }
  .btn:hover { background: #5d5d63; }
  .btn:disabled { opacity: .45; }
  .btn.primary { background: var(--accent); }
  .btn.warn { color: #ffb4ab; }
  .link { border: 0; background: none; padding: 0; color: var(--link); cursor: default; font-size: inherit; }
  .link:hover { text-decoration: underline; }

  /* widgets list */
  .wlist { list-style: none; margin: 0; padding: 0; }
  .wrow, .whead {
    display: grid; grid-template-columns: 22px 22px 1fr 118px 46px; align-items: center; gap: 10px;
    padding: 7px 14px; min-height: 42px;
  }
  .whead { min-height: 0; padding-top: 6px; padding-bottom: 6px; font-size: 11px; color: var(--text3); border-top: 1px solid var(--sep); }
  .wrow { border-top: 1px solid var(--sep); background: var(--group); }
  .wrow.off .t { color: var(--text2); }
  .wrow.drop-before { box-shadow: inset 0 2px 0 var(--accent); }
  .wrow.drop-after { box-shadow: inset 0 -2px 0 var(--accent); }
  .wrow.dragging { opacity: .5; }
  .wrow:last-child { border-radius: 0 0 10px 10px; }
  .handle { border: 0; background: transparent; color: var(--text3); width: 22px; height: 26px; display: grid; place-items: center; cursor: grab; border-radius: 5px; padding: 0; }
  .handle:hover { color: var(--text); background: rgba(255,255,255,.07); }
  .handle svg { width: 12px; height: 14px; }
  .wic { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; background: rgba(255,255,255,.08); color: var(--text); }
  .wic svg { width: 13px; height: 13px; }
  .sepc { display: flex; justify-content: center; }
  .swc { display: flex; justify-content: flex-end; }
  .clockrow { display: grid; grid-template-columns: 22px 22px 1fr auto; gap: 10px; align-items: center; padding: 8px 14px; border-top: 1px solid var(--sep); color: var(--text2); font-size: 12px; }
  .clockrow svg { width: 13px; height: 13px; }

  /* app pages */
  kbd { font: 12px var(--font); padding: 1px 6px; border-radius: 5px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.12); color: var(--text); margin-left: 3px; }
  .kv { color: var(--text); font-variant-numeric: tabular-nums; }
  .perm-st { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text2); white-space: nowrap; }
  .perm-st svg { width: 14px; height: 14px; }
  .perm-st.ok svg { color: var(--ok); }
  .perm-st.ok { color: #c6f6cf; }
  .search { display: flex; align-items: center; gap: 8px; flex: 1; padding: 5px 9px; border-radius: 7px; background: rgba(0,0,0,.25); border: 1px solid rgba(255,255,255,.1); }
  .search svg { width: 13px; height: 13px; color: var(--text3); flex: none; }
  .search input { flex: 1; border: 0; background: transparent; font-size: 13px; outline: none; }
  .search:focus-within { outline: 2px solid var(--focus); outline-offset: 1px; }
  .search input::placeholder { color: var(--text3); }
  .version { margin: 22px 0 0; text-align: center; color: var(--text3); font-size: 11.5px; }

  .toast {
    position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 20;
    display: flex; align-items: center; gap: 12px; padding: 8px 10px 8px 14px; border-radius: 10px;
    background: #3a3a3e; border: 1px solid rgba(255,255,255,.12); box-shadow: 0 10px 30px rgba(0,0,0,.5); font-size: 12.5px;
  }
  .toast[hidden] { display: none; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before { transition: none !important; }
    .scroll { scroll-behavior: auto; }
  }
</style>
</head>
<body>

<div class="board-label" aria-hidden="true"><b>SmartWindow · Settings</b> — Direction 03 · Displays in the sidebar</div>

<div class="demo" role="region" aria-label="Demo controls, not part of the app">
  <span class="tag">Demo</span>
  <fieldset class="seg-wrap">
    <legend>Connected displays</legend>
    <div class="seg" role="radiogroup" aria-label="Connected displays">
      <input type="radio" name="demo-n" id="demo-n1" value="1"><label for="demo-n1">1</label>
      <input type="radio" name="demo-n" id="demo-n2" value="2" checked><label for="demo-n2">2</label>
    </div>
  </fieldset>
  <fieldset id="demo-lid-f">
    <legend>MacBook lid</legend>
    <div class="seg" role="radiogroup" aria-label="MacBook Pro lid">
      <input type="radio" name="demo-lid" id="demo-lid-c" value="closed" checked><label for="demo-lid-c">Closed</label>
      <input type="radio" name="demo-lid" id="demo-lid-o" value="open"><label for="demo-lid-o">Open</label>
    </div>
  </fieldset>
</div>

<div class="window" role="group" aria-label="SmartWindow Settings window">
  <div class="sidebar">
    <div class="lights" aria-hidden="true"><span></span><span></span><span></span></div>
    <nav class="side-scroll" id="sidebar" aria-label="Settings"></nav>
  </div>
  <main id="main" aria-labelledby="page-title">
    <div class="toolbar" id="toolbar"></div>
    <div class="scroll" id="scroll"></div>
    <div class="toast" id="toast" hidden></div>
  </main>
</div>
<div class="sr" id="live" role="status" aria-live="polite"></div>

<script>
/* ================= Icons ================= */
const sv = (body, extra='') => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${extra}>${body}</svg>`;
const I = {
  gear: sv('<path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>'),
  bar: sv('<rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M3 9h18"/>'),
  widgets: sv('<rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/>'),
  notch: sv('<rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M8 4v1.5a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2V4" fill="currentColor"/>'),
  clock: sv('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),

/* ================= Data ================= */
const DISPLAYS = [
  { id: 'lg', name: 'LG ULTRAWIDE', icon: 'monitor', spec: '2560 × 1080', role: 'Main display', camera: false },
  { id: 'mbp', name: 'MacBook Pro', icon: 'laptop', spec: 'Built-in Retina · 1512 × 982', role: 'Camera notch', camera: true },
];
const WIDGETS = {
  memory:   { name: 'Memory', pv: '62%' },
  cpu:      { name: 'CPU', pv: '18%' },
  temp:     { name: 'Temperature', pv: null },
  gpu:      { name: 'GPU', pv: '9%' },
  battery:  { name: 'Battery', pv: '86%' },
  mic:      { name: 'Microphone', pv: '' },
  volume:   { name: 'Volume', pv: '' },
  tailscale:{ name: 'Tailscale VPN', pv: '' },
  keyboard: { name: 'Keyboard input', pv: 'ES' },
};
const WIDGET_ICON = { memory: 'memory', cpu: 'cpu', temp: 'temp', gpu: 'gpu', battery: 'battery', mic: 'mic', volume: 'volume', tailscale: 'tailscale', keyboard: 'keyboard' };
const TZ_ALL = ['America/New_York','Europe/Madrid','Europe/London','Europe/Berlin','America/Los_Angeles','America/Bogota','America/Mexico_City','America/Sao_Paulo','Asia/Tokyo','Asia/Singapore','Asia/Kolkata','Australia/Sydney'];

const S = {
  displaysMode: 2,   // demo: 1 = single-display setup, 2 = LG ULTRAWIDE + MacBook Pro
  lidOpen: false,    // demo: MacBook Pro lid
  page: 'd:default',
  def: { opacity: 94, order: Object.keys(WIDGETS), notchShow: true, notchIdle: true, notchBg: 'black', notchW: 280, notchH: 34, notchX: 0 },
  ovr: { lg: { opacity: 100, 'w.tailscale.v': true, notchX: 40 }, mbp: { notchW: 180, notchH: 33 } },
  app: { login: true, focus: false, unit: 'c', clockShow: 'local', tz: ['America/New_York', 'Europe/Madrid'], tzQuery: '', music: 'notasked' },
};
Object.keys(WIDGETS).forEach((id, i) => { S.def[`w.${id}.v`] = i < 5; S.def[`w.${id}.s`] = id === 'battery'; });

const SECTIONS = {
  bar: () => ['opacity'],
  widgets: () => ['order', ...Object.keys(WIDGETS).flatMap(id => [`w.${id}.v`, `w.${id}.s`])],
  notch: () => ['notchShow', 'notchIdle', 'notchBg', 'notchW', 'notchH', 'notchX'],
};

/* ================= Model helpers ================= */
const known = () => S.displaysMode === 2 ? DISPLAYS : [DISPLAYS[0]];
const disp = id => DISPLAYS.find(d => d.id === id);
const isConnected = d => d.id === 'lg' || S.lidOpen;
const scope = () => {
  if (!S.page.startsWith('d:')) return null;
  const sc = S.page.slice(2);
  return S.displaysMode === 1 ? 'default' : sc;
};
const multi = () => S.displaysMode === 2;
const get = (sc, k) => (sc && sc !== 'default' && k in S.ovr[sc]) ? S.ovr[sc][k] : S.def[k];
const customCount = id => Object.keys(S.ovr[id]).length;
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);

function keyLabel(k) {
  const m = k.match(/^w\.(\w+)\.(v|s)$/);
  if (m) return m[2] === 'v' ? `${WIDGETS[m[1]].name} widget` : `Separator after ${WIDGETS[m[1]].name}`;
  return { opacity: 'Bar opacity', order: 'Widget order', notchShow: 'Show notch', notchIdle: 'Show when nothing is playing', notchBg: 'Notch background', notchW: 'Notch width', notchH: 'Notch height', notchX: 'Expanded width' }[k];
}
function fmt(k, v) {
  const m = k.match(/^w\.(\w+)\.(v|s)$/);
  if (m) return m[2] === 'v' ? (v ? 'shown' : 'hidden') : (v ? 'separator after' : 'no separator');
  switch (k) {
    case 'opacity': return v + '%';
    case 'order': return v.slice(0, 3).map(id => WIDGETS[id].name).join(', ') + '…';
    case 'notchShow': case 'notchIdle': return v ? 'On' : 'Off';
    case 'notchBg': return v === 'black' ? 'Black' : 'Match bar color';
    case 'notchW': case 'notchH': return v + ' pt';
    case 'notchX': return v ? `+${v} pt` : 'Same';
  }
}
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const fmtOverride = (k, v) => k === 'order' ? 'custom order' : fmt(k, v);

/* Inline scope indicator for a row. keys = settings controlled by the row. */
function metaHTML(keys, label, compact) {
  const sc = scope();
  if (sc === 'default') {
    if (!multi()) return '';
    const chips = known().map(d => {
      const ks = keys.filter(k => k in S.ovr[d.id]);
      if (!ks.length) return '';
      const val = ks.map(k => fmtOverride(k, S.ovr[d.id][k])).join(', ');
      return `<button class="ovr" data-jump="${d.id}" aria-label="${d.name} overrides ${label}: ${val}. Open ${d.name}">${I[d.icon]}${d.name}: ${val}</button>`;
    }).join('');
    return chips ? `<span class="ovr-lbl">Overridden on</span>${chips}` : '';
  }
  const custom = keys.filter(k => k in S.ovr[sc]);
  const defVal = keys.map(k => fmt(k, S.def[k])).join(', ');
  if (!custom.length) return `<span class="inh">Default${compact ? '' : ' · ' + defVal}</span>`;
  return `<span class="cust"><span class="dot" aria-hidden="true"></span>Custom</span>` +
         `<span class="inh">Default is ${defVal}</span>` +
         `<button class="reset" data-reset="${keys.join(',')}" aria-label="Reset ${label} to Default (${defVal})" title="Reset to Default">${I.reset}</button>`;
}

/* ================= Rendering ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function navItem({ page, icon, color, name, sub, badge, subIcon }) {
  const cur = S.page === page ? ' aria-current="page"' : '';
  const b = badge ? `<span class="badge" aria-label="${badge} custom settings">${badge}</span>` : '<span></span>';
  return `<li><button class="nav" data-page="${page}" id="nav-${page.replace(':', '-')}"${cur}>
    <span class="sq ${color}">${I[icon]}</span>
    <span><span class="nm">${name}</span>${sub ? `<span class="sb">${subIcon || ''}${sub}</span>` : ''}</span>${b}
  </button></li>`;
}

function renderSidebar() {
  let h = '';
  if (multi()) {
    h += `<h2 class="grp" id="g-disp">Displays</h2><ul class="nav-list" aria-labelledby="g-disp">`;
    h += navItem({ page: 'd:default', icon: 'monitors', color: 'c-slate', name: 'Default', sub: 'All displays' });
    for (const d of known()) {
      const n = customCount(d.id);
      const conn = isConnected(d);
      h += navItem({ page: 'd:' + d.id, icon: d.icon, color: 'c-slate', name: d.name,
        sub: conn ? (d.id === 'lg' ? 'Connected · Main' : 'Connected') : 'Not connected',
        subIcon: conn ? `<span style="color:var(--ok)">${I.check}</span>` : I.off, badge: n });
    }
    h += `</ul><p class="hint">${I.info}<span>Displays that aren't connected keep their settings and use them again when they reconnect.</span></p>`;
  } else {
    h += `<h2 class="grp" id="g-disp">Display</h2><ul class="nav-list" aria-labelledby="g-disp">`;
    h += navItem({ page: 'd:default', icon: 'monitor', color: 'c-slate', name: 'LG ULTRAWIDE', sub: 'Bar, widgets & notch' });
    h += `</ul>`;
  }
  h += `<h2 class="grp" id="g-app">App</h2><ul class="nav-list" aria-labelledby="g-app">`;
  h += navItem({ page: 'general', icon: 'gear', color: 'c-gray', name: 'General' });
  h += navItem({ page: 'clock', icon: 'clock', color: 'c-orange', name: 'Clock' });
  h += navItem({ page: 'tailscale', icon: 'tailscale', color: 'c-teal', name: 'Tailscale' });
  h += navItem({ page: 'permissions', icon: 'hand', color: 'c-blue', name: 'Permissions' });
  h += `</ul>`;
  $('#sidebar').innerHTML = h;
}

/* --- row builders --- */
function sliderRow(k, title, desc, min, max, step, opts = {}) {
  return `<div class="row" data-row="${k}"${opts.notch ? ' data-needs-notch' : ''}>
    <div class="lbl"><label class="t" for="ctl-${k}">${title}</label>${desc ? `<span class="d">${desc}</span>` : ''}
      <div class="meta" data-meta="${k}" data-label="${keyLabel(k)}"></div></div>
    <div class="slider"><input type="range" id="ctl-${k}" data-ctl="${k}" min="${min}" max="${max}" step="${step}"${opts.notch ? ' data-needs-notch' : ''}>
      <output for="ctl-${k}" data-out="${k}"></output></div>
  </div>`;
}
function switchRow(k, title, desc, opts = {}) {
  return `<div class="row" data-row="${k}"${opts.notch ? ' data-needs-notch' : ''}>
    <div class="lbl"><label class="t" for="ctl-${k}">${title}</label>${desc ? `<span class="d">${desc}</span>` : ''}
      <div class="meta" data-meta="${k}" data-label="${keyLabel(k)}"></div></div>
    <input type="checkbox" role="switch" id="ctl-${k}" data-ctl="${k}"${opts.notch ? ' data-needs-notch' : ''}>
  </div>`;
}
function segRow(k, title, desc, options, opts = {}) {
  const radios = options.map(([v, l], i) => `<input type="radio" name="r-${k}" id="ctl-${k}-${i}" value="${v}" data-ctl="${k}"${opts.notch ? ' data-needs-notch' : ''}><label for="ctl-${k}-${i}">${l}</label>`).join('');
  return `<div class="row" data-row="${k}"${opts.notch ? ' data-needs-notch' : ''}>
    <div class="lbl"><span class="t" id="lbl-${k}">${title}</span>${desc ? `<span class="d">${desc}</span>` : ''}
      <div class="meta" data-meta="${k}" data-label="${keyLabel(k)}"></div></div>
    <div class="seg" role="radiogroup" aria-labelledby="lbl-${k}">${radios}</div>
  </div>`;
}

function displayPage() {
  const sc = scope();
  const d = sc === 'default' ? null : disp(sc);
  const single = !multi();
  let h = '';
  // identity
  if (single) {
    const lg = DISPLAYS[0];
    h += `<div class="ident"><div class="ident-ic c-slate">${I.monitor}</div><div>
      <div class="spec">${lg.spec} · Main display</div>
      <div class="status ok">${I.check}Connected</div></div><span></span></div>`;
  } else if (!d) {
    h += `<div class="ident"><div class="ident-ic c-slate">${I.monitors}</div><div>
      <div class="spec">Base settings for all displays</div>
      <div class="status">${I.globe}Every display starts from these values</div></div><span></span></div>`;
  } else {
    const conn = isConnected(d);
    h += `<div class="ident"><div class="ident-ic c-slate">${I[d.icon]}</div><div>
      <div class="spec">${d.spec} · ${d.role}</div>
      ${conn ? `<div class="status ok">${I.check}Connected</div>`
             : `<div class="status off">${I.off}Not connected — lid closed. Settings are kept and apply when it reconnects.</div>`}
      </div><button class="btn warn" id="reset-all" data-resetall="${d.id}">Reset all settings for ${d.name}</button></div>`;
  }
  h += `<p class="summary" data-summary></p>`;
  // preview
  h += `<figure class="pv-wrap"><figcaption class="pv-cap"><span>Preview · ${single ? 'LG ULTRAWIDE' : d ? d.name : 'Default'}</span><span>Not to scale</span></figcaption>
        <div class="pv" data-preview role="img"></div></figure>`;
  // Bar
  h += `<section class="sec" id="sec-bar" aria-labelledby="h-bar"><h2 class="sec-h" id="h-bar"><span class="sq sm c-pink">${I.bar}</span>Bar<span class="cnt" data-seccount="bar"></span></h2>
    <div class="group">${sliderRow('opacity', 'Bar opacity', 'Lower values let the wallpaper show through.', 60, 100, 1)}</div></section>`;
  // Widgets
  const order = get(sc, 'order');
  const rows = order.map((id, i) => `
    <li class="wrow" draggable="true" data-wid="${id}">
      <button class="handle" id="handle-${id}" data-handle="${id}" aria-label="Reorder ${WIDGETS[id].name}, position ${i + 1} of ${order.length}" aria-describedby="reorder-help">${I.grip}</button>
      <span class="wic">${I[WIDGET_ICON[id]]}</span>
      <div class="lbl"><span class="t">${WIDGETS[id].name}</span>
        <div class="meta" data-meta="w.${id}.v,w.${id}.s" data-label="${WIDGETS[id].name} widget" data-compact="1"></div></div>
      <span class="sepc"><input type="checkbox" id="ctl-w.${id}.s" data-ctl="w.${id}.s" aria-label="Separator after ${WIDGETS[id].name}"></span>
      <span class="swc"><input type="checkbox" role="switch" id="ctl-w.${id}.v" data-ctl="w.${id}.v" aria-label="Show ${WIDGETS[id].name}"></span>
    </li>`).join('');
  h += `<section class="sec" id="sec-widgets" aria-labelledby="h-widgets"><h2 class="sec-h" id="h-widgets"><span class="sq sm c-blue">${I.widgets}</span>Widgets<span class="cnt" data-seccount="widgets"></span></h2>
    <div class="group">
      <div class="row" data-row="order"><div class="lbl"><span class="t">Order in the bar</span>
        <span class="d" id="reorder-help">Drag a row, or focus its handle and press ↑ or ↓.</span>
        <div class="meta" data-meta="order" data-label="Widget order"></div></div></div>
      <div class="whead" aria-hidden="true"><span></span><span></span><span>Widget</span><span style="text-align:center">Separator after</span><span style="text-align:right">Visible</span></div>
      <ul class="wlist" id="wlist" aria-label="Widgets, in bar order">${rows}</ul>
      <div class="clockrow"><span></span><span class="wic">${I.clock}</span><span><span class="t" style="color:var(--text)">Clock</span>Always at the far right of the bar. Set it up in App › Clock.</span><span aria-hidden="true">${I.lock}</span></div>
    </div></section>`;
  // Notch
  const cam = d ? d.camera : false;
  h += `<section class="sec" id="sec-notch" aria-labelledby="h-notch"><h2 class="sec-h" id="h-notch"><span class="sq sm c-indigo">${I.notch}</span>Notch<span class="cnt" data-seccount="notch"></span></h2>
    <div class="group">
      ${switchRow('notchShow', d ? 'Show notch on this display' : 'Show notch', 'Media and HUD pill at the top center of the bar.')}
      ${switchRow('notchIdle', 'Show when nothing is playing', 'Otherwise the notch appears only for media and HUD.', { notch: true })}
      ${segRow('notchBg', 'Background', '', [['black', 'Black'], ['bar', 'Match bar color']], { notch: true })}
    </div>
    <h3 class="sub-h small">Size</h3>
    <div class="group">
      ${sliderRow('notchW', 'Width', '', 180, 440, 1, { notch: true })}
      ${sliderRow('notchH', 'Height', '', 30, 46, 1, { notch: true })}
      ${sliderRow('notchX', 'Expanded width', 'Extra width while media or a HUD is expanded.', 0, 200, 5, { notch: true })}
    </div>
    <p class="note">${I.info}<span>${cam ? 'This display has a camera notch, so the width includes the camera.' : 'On displays with a camera notch, the width includes the camera.'}</span></p>
  </section>`;
  return h;
}

function summaryHTML() {
  const sc = scope();
  if (!multi()) return `These settings apply to your display. Connect another display to customize each one separately.`;
  if (sc === 'default') {
    const parts = known().filter(d => customCount(d.id)).map(d => {
      const n = customCount(d.id);
      return `<button class="link" data-jump="${d.id}">${d.name}</button> customizes ${n} setting${n > 1 ? 's' : ''}`;
    });
    return `<strong>Applies to every display without its own setting.</strong> ` +
      (parts.length ? parts.join(' and ') + '; each override is listed under its setting.' : 'No display has custom settings yet.');
  }
  const d = disp(sc), n = customCount(sc);
  if (!n) return `<strong>No custom settings — uses Default.</strong> Change anything below to customize it for ${d.name} only.`;
  return `<span class="dot" aria-hidden="true"></span><strong>${d.name} customizes ${n} setting${n > 1 ? 's' : ''}.</strong> Changes here apply only to this display; everything else follows <button class="link" data-page="d:default">Default</button>.`;
}

function previewHTML() {
  const sc = scope();
  const d = sc && sc !== 'default' ? disp(sc) : null;
  const op = get(sc, 'opacity');
  const barBg = `rgba(24,24,28,${op / 100})`;
  const order = get(sc, 'order');
  let w = '';
  const shown = [];
  for (const id of order) {
    if (!get(sc, `w.${id}.v`)) continue;
    shown.push(WIDGETS[id].name);
    const txt = id === 'temp' ? (S.app.unit === 'c' ? '48°C' : '118°F') : WIDGETS[id].pv;
    w += `<span class="pw">${I[WIDGET_ICON[id]]}${txt}</span>`;
    if (get(sc, `w.${id}.s`)) w += `<span class="pw-sep"></span>`;
  }
  let notch = '';
  if (get(sc, 'notchShow')) {
    const k = .6, W = get(sc, 'notchW') * k, H = get(sc, 'notchH') * k, X = get(sc, 'notchX') * k;
    const bg = get(sc, 'notchBg') === 'black' ? '#000' : barBg;
    if (X) notch += `<div class="pv-ghost" style="width:${W + X}px;height:${H + 6}px"></div>`;
    notch += `<div class="pv-notch" style="width:${W}px;height:${H}px;background:${bg}">${d && d.camera ? '<span class="pv-cam"></span>' : '<span class="pv-eq"><i style="height:4px"></i><i style="height:7px"></i><i style="height:5px"></i></span>'}</div>`;
  }
  const label = `Bar at ${op}% opacity showing ${shown.join(', ') || 'no widgets'} and the clock. ` +
    (get(sc, 'notchShow') ? `Notch ${get(sc, 'notchW')} by ${get(sc, 'notchH')} points.` : 'Notch hidden.');
  return { label, html: `<div class="pv-bar" style="background:${barBg}"><span class="pv-tab on">Safari</span><span class="pv-tab">Xcode</span><span class="pv-tab">Figma</span>
    <span class="pv-r">${w}<span>Sun 8 Nov 10:42</span></span></div>${notch}` };
}

function generalPage() {
  const a = S.app;
  return `<h2 class="sub-h">Startup & focus</h2>
  <div class="group">
    <div class="row"><div class="lbl"><label class="t" for="app-login">Launch at login</label></div>
      <input type="checkbox" role="switch" id="app-login" data-app="login"${a.login ? ' checked' : ''}></div>
    <div class="row"><div class="lbl"><label class="t" for="app-focus">Focus mode</label><span class="d">Hides secondary widgets on all displays.</span></div>
      <input type="checkbox" role="switch" id="app-focus" data-app="focus"${a.focus ? ' checked' : ''}></div>
  </div>
  <h2 class="sub-h">Units</h2>
  <div class="group">
    <div class="row"><div class="lbl"><span class="t" id="lbl-unit">Temperature unit</span><span class="d">Used by the Temperature widget.</span></div>
      <div class="seg" role="radiogroup" aria-labelledby="lbl-unit">
        <input type="radio" name="unit" id="unit-c" value="c" data-app="unit"${a.unit === 'c' ? ' checked' : ''}><label for="unit-c">Celsius</label>
        <input type="radio" name="unit" id="unit-f" value="f" data-app="unit"${a.unit === 'f' ? ' checked' : ''}><label for="unit-f">Fahrenheit</label>
      </div></div>
  </div>
  <h2 class="sub-h">Keyboard shortcuts</h2>
  <div class="group" role="list" aria-label="Keyboard shortcuts">
    <div class="row" role="listitem"><span class="lbl t">Next window</span><span><kbd>⌥</kbd><kbd>]</kbd></span></div>
    <div class="row" role="listitem"><span class="lbl t">Previous window</span><span><kbd>⌥</kbd><kbd>[</kbd></span></div>
    <div class="row" role="listitem"><span class="lbl t">Jump to tab 1–9</span><span><kbd>⌥</kbd><kbd>1</kbd> … <kbd>9</kbd></span></div>
  </div>
  <p class="version">SmartWindow · Version 0.4.0</p>`;
}

function tzTime(tz) {
  try { return new Intl.DateTimeFormat('en-US', { timeZone: tz, hour: 'numeric', minute: '2-digit' }).format(new Date()); }
  catch { return ''; }
}
const city = tz => tz.split('/').pop().replace(/_/g, ' ');
function clockPage() {
  const a = S.app;
  const q = a.tzQuery.trim().toLowerCase();
  const results = q ? TZ_ALL.filter(t => !a.tz.includes(t) && t.toLowerCase().replace(/_/g, ' ').includes(q)).slice(0, 5) : [];
  const added = a.tz.map(t => `<div class="row"><span class="wic">${I.globe}</span><div class="lbl"><span class="t">${city(t)}</span><span class="d">${t}</span></div>
      <span class="kv">${tzTime(t)}</span><button class="reset" data-tzrm="${t}" aria-label="Remove ${t}" title="Remove">${I.x}</button></div>`).join('');
  const res = results.map(t => `<div class="row"><div class="lbl"><span class="t">${city(t)}</span><span class="d">${t} · ${tzTime(t)}</span></div>
      <button class="btn" data-tzadd="${t}" aria-label="Add ${t}">Add</button></div>`).join('');
  return `<h2 class="sub-h">In the bar</h2>
  <div class="group">
    <div class="row"><div class="lbl"><span class="t" id="lbl-clock">Shown in the bar</span><span class="d">The clock always sits at the far right of the bar.</span></div>
      <div class="seg" role="radiogroup" aria-labelledby="lbl-clock">
        <input type="radio" name="clk" id="clk-l" value="local" data-app="clockShow"${a.clockShow === 'local' ? ' checked' : ''}><label for="clk-l">Local time</label>
        <input type="radio" name="clk" id="clk-t" value="tz" data-app="clockShow"${a.clockShow === 'tz' ? ' checked' : ''}><label for="clk-t">Added timezones</label>
      </div></div>
  </div>
  <h2 class="sub-h">Extra timezones</h2>
  <div class="group">
    <div class="row"><label class="search">${I.search}<span class="sr">Search timezones</span>
      <input type="search" id="tz-q" data-tzq placeholder="Search timezones, e.g. Tokyo" value="${esc(a.tzQuery)}" autocomplete="off"></label></div>
    ${res || (q ? `<div class="row"><span class="d">No matching timezones.</span></div>` : '')}
  </div>
  <h3 class="sub-h small">Added</h3>
  <div class="group">${added || `<div class="row"><span class="d">No extra timezones. Search above to add one.</span></div>`}</div>`;
}

function tailscalePage() {
  const on = known().filter(d => get(d.id, 'w.tailscale.v')).map(d => d.name);
  const where = !multi() ? (S.def['w.tailscale.v'] ? 'Shown in the bar.' : 'Hidden from the bar.')
    : on.length ? `Shown in the bar on ${on.join(' and ')}.` : 'Hidden from the bar on every display.';
  return `<h2 class="sub-h">Status</h2>
  <div class="group">
    <div class="row"><span class="lbl t">Status</span><span class="perm-st ok">${I.check}Connected</span></div>
    <div class="row"><span class="lbl t">Tailnet</span><span class="kv">kevnnard.github</span></div>
    <div class="row"><span class="lbl t">IP address</span><span class="kv">100.101.12.4</span></div>
    <div class="row"><span class="lbl t">Online for</span><span class="kv">3h 12m</span></div>
    <div class="row"><span class="lbl d">Sign-in and network settings are managed in the Tailscale app.</span><button class="btn">Open Tailscale</button></div>
  </div>
  <h2 class="sub-h">In the bar</h2>
  <div class="group">
    <div class="row"><span class="wic">${I.tailscale}</span><div class="lbl"><span class="t">Tailscale VPN widget</span><span class="d">${where}</span></div>
      <button class="btn" data-goto="d:default#sec-widgets">Edit in Widgets</button></div>
  </div>`;
}

function permRow(icon, color, title, purpose, status, button) {
  const st = { ok: [I.check, 'Granted', ' ok'], check: [I.q, 'Open the app to check', ''], notasked: [I.dashc, 'Not asked', ''] }[status];
  return `<div class="row"><span class="sq ${color}">${I[icon]}</span><div class="lbl"><span class="t">${title}</span><span class="d">${purpose}</span></div>
    <span class="perm-st${st[2]}">${st[0]}${st[1]}</span>${button || ''}</div>`;
}
function permissionsPage() {
  const m = S.app.music;
  return `<h2 class="sub-h">Required</h2>
  <div class="group">${permRow('hand', 'c-blue', 'Accessibility', 'Reads and switches windows for the bar tabs.', 'ok')}</div>
  <h2 class="sub-h">Optional</h2>
  <div class="group">
    ${permRow('music', 'c-green', 'Automation: Spotify', 'Shows what’s playing and controls playback in the notch.', 'check', '<button class="btn">Open Spotify</button>')}
    ${permRow('music', 'c-pink', 'Automation: Music', 'Shows what’s playing in Apple Music and controls it from the notch.', m, m === 'ok' ? '' : '<button class="btn primary" data-allow="music">Allow…</button>')}
    ${permRow('disk', 'c-gray', 'Full Disk Access', 'Lets status widgets read system information.', 'ok')}
    ${permRow('moon', 'c-indigo', 'Focus Status', 'Lets SmartWindow react when a Focus is on.', 'ok')}
  </div>
  <p class="note">${I.info}<span>Status is checked when this page opens. Optional permissions only enable the features listed.</span></p>`;
}

function renderPage() {
  const isD = S.page.startsWith('d:');
  const sc = scope();
  let title, right = '';
  if (isD) {
    title = !multi() ? 'Display' : sc === 'default' ? 'Default' : disp(sc).name;
    right = `<nav class="jump" aria-label="Sections on this page">
      <button data-sec="sec-bar">Bar</button><button data-sec="sec-widgets">Widgets</button><button data-sec="sec-notch">Notch</button></nav>`;
  } else {
    title = cap(S.page);
    right = `<span class="scope-tag">${I.globe}Applies to all displays</span>`;
  }
  $('#toolbar').innerHTML = `<h1 id="page-title">${title}</h1>${right}`;
  $('#scroll').innerHTML = isD ? displayPage()
    : { general: generalPage, clock: clockPage, tailscale: tailscalePage, permissions: permissionsPage }[S.page]();
}

function render(keepScroll) {
  const fid = document.activeElement && document.activeElement.id;
  const st = $('#scroll').scrollTop;
  renderSidebar();
  renderPage();
  sync();
  if (keepScroll) $('#scroll').scrollTop = st;
  const el = fid && document.getElementById(fid);
  if (el) el.focus({ preventScroll: true });
}

/* Update every value, indicator, count and preview from state without rebuilding the page. */
function sync() {
  const sc = scope();
  document.querySelectorAll('[data-ctl]').forEach(el => {
    const k = el.dataset.ctl, v = get(sc, k);
    if (el.type === 'range') {
      el.value = v;
      el.style.setProperty('--p', ((v - el.min) / (el.max - el.min) * 100) + '%');
      el.setAttribute('aria-valuetext', fmt(k, v));
    } else if (el.type === 'radio') el.checked = el.value === v;
    else el.checked = !!v;
  });
  document.querySelectorAll('[data-out]').forEach(el => el.textContent = fmt(el.dataset.out, get(sc, el.dataset.out)));
  document.querySelectorAll('[data-meta]').forEach(el => {
    const keys = el.dataset.meta.split(',');
    el.innerHTML = metaHTML(keys, el.dataset.label, el.dataset.compact);
  });
  document.querySelectorAll('.wrow').forEach(li => li.classList.toggle('off', !get(sc, `w.${li.dataset.wid}.v`)));
  const notchOn = get(sc, 'notchShow');
  document.querySelectorAll('input[data-needs-notch]').forEach(el => el.disabled = !notchOn);
  document.querySelectorAll('.row[data-needs-notch]').forEach(el => el.classList.toggle('dim', !notchOn));
  const sum = $('[data-summary]'); if (sum) sum.innerHTML = summaryHTML();
  document.querySelectorAll('[data-seccount]').forEach(el => {
    const n = sc && sc !== 'default' ? SECTIONS[el.dataset.seccount]().filter(k => k in S.ovr[sc]).length : 0;
    el.innerHTML = n ? `<span class="dot" aria-hidden="true"></span>${n} custom` : '';
  });
  const pv = $('[data-preview]');
  if (pv) { const p = previewHTML(); pv.innerHTML = p.html; pv.setAttribute('aria-label', p.label); }
  const ra = $('#reset-all');
  if (ra) ra.disabled = !customCount(ra.dataset.resetall);
  // sidebar badges (keep sidebar focus intact)
  for (const d of known()) {
    const btn = document.getElementById('nav-d-' + d.id); if (!btn) continue;
    const n = customCount(d.id), b = btn.lastElementChild;
    b.outerHTML = n ? `<span class="badge" aria-label="${n} custom settings">${n}</span>` : '<span></span>';
  }
}

function setv(k, v) {
  const sc = scope();
  if (sc === 'default') S.def[k] = v; else S.ovr[sc][k] = v;
  sync();
}

/* ================= Feedback ================= */
let toastTimer;
function announce(msg) { const l = $('#live'); l.textContent = ''; setTimeout(() => l.textContent = msg, 30); }
function toast(msg, undo) {
  const t = $('#toast');
  t.innerHTML = `<span>${msg}</span>${undo ? '<button class="btn" id="toast-undo">Undo</button>' : ''}`;
  t.hidden = false; announce(msg);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 6000);
  if (undo) $('#toast-undo').onclick = () => { undo(); t.hidden = true; };
}

function go(page, sec) {
  S.page = page; render();
  const sc = $('#scroll');
  if (sec) { const el = document.getElementById(sec); if (el) sc.scrollTop = el.offsetTop - 4; }
  else sc.scrollTop = 0;
}

/* ================= Events ================= */
document.addEventListener('click', e => {
  const t = e.target.closest('button, [data-page]'); if (!t) return;
  if (t.dataset.page) { go(t.dataset.page); return; }
  if (t.dataset.jump) { go('d:' + t.dataset.jump); document.getElementById('nav-d-' + t.dataset.jump)?.focus(); return; }
  if (t.dataset.goto) { const [p, s] = t.dataset.goto.split('#'); go(p, s); return; }
  if (t.dataset.sec) { const el = document.getElementById(t.dataset.sec); $('#scroll').scrollTop = el.offsetTop - 4; el.querySelector('input, button')?.focus({ preventScroll: true }); return; }
  if (t.dataset.reset) {
    const sc = scope(), keys = t.dataset.reset.split(',');
    const label = keys.length > 1 ? t.getAttribute('aria-label').replace(/^Reset | to Default.*$/g, '') : keyLabel(keys[0]);
    keys.forEach(k => delete S.ovr[sc][k]);
    const needsRebuild = keys.includes('order');
    needsRebuild ? render(true) : sync();
    const target = document.getElementById('ctl-' + keys[0]) || document.getElementById('ctl-' + keys[0] + '-0') || document.getElementById('handle-' + get(sc, 'order')[0]);
    target?.focus({ preventScroll: true });
    announce(`${label} now uses Default on ${disp(sc).name}.`);
    return;
  }
  if (t.dataset.resetall) {
    const id = t.dataset.resetall, snap = { ...S.ovr[id] }, n = Object.keys(snap).length;
    S.ovr[id] = {}; render(true);
    toast(`Reset ${n} setting${n > 1 ? 's' : ''} for ${disp(id).name} to Default.`, () => { S.ovr[id] = snap; render(true); });
    return;
  }
  if (t.dataset.tzadd) { S.app.tz.push(t.dataset.tzadd); S.app.tzQuery = ''; render(true); $('#tz-q').focus(); announce(`Added ${t.dataset.tzadd}`); return; }
  if (t.dataset.tzrm) { S.app.tz = S.app.tz.filter(x => x !== t.dataset.tzrm); render(true); $('#tz-q').focus(); announce(`Removed ${t.dataset.tzrm}`); return; }
  if (t.dataset.allow) { S.app.music = 'ok'; render(true); announce('Automation: Music granted'); return; }
});

document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.ctl && el.type === 'range') setv(el.dataset.ctl, +el.value);
  if ('tzq' in el.dataset) {
    S.app.tzQuery = el.value; render(true);
    const q = $('#tz-q'); q.setSelectionRange(q.value.length, q.value.length);
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.ctl && el.type === 'checkbox') setv(el.dataset.ctl, el.checked);
  else if (el.dataset.ctl && el.type === 'radio') setv(el.dataset.ctl, el.value);
  else if (el.dataset.app) {
    S.app[el.dataset.app] = el.type === 'radio' ? el.value : el.checked;
  } else if (el.name === 'demo-n') {
    S.displaysMode = +el.value;
    $('#demo-lid-f').style.display = S.displaysMode === 2 ? '' : 'none';
    if (S.displaysMode === 1 && S.page.startsWith('d:')) S.page = 'd:default';
    render(); announce(S.displaysMode === 1 ? 'One display: editing settings directly' : 'Two displays: per-display settings available');
  } else if (el.name === 'demo-lid') {
    S.lidOpen = el.value === 'open'; render(true);
  }
});

/* Widget reorder: drag & drop + keyboard on the handle */
function moveWidget(id, to) {
  const sc = scope(), order = [...get(sc, 'order')];
  const from = order.indexOf(id); if (from < 0 || to < 0 || to >= order.length || from === to) return false;
  order.splice(from, 1); order.splice(to, 0, id);
  if (sc === 'default') S.def.order = order; else S.ovr[sc].order = order;
  render(true);
  announce(`${WIDGETS[id].name} moved to position ${to + 1} of ${order.length}`);
  return true;
}
document.addEventListener('keydown', e => {
  const h = e.target.dataset && e.target.dataset.handle; if (!h) return;
  if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
  e.preventDefault();
  const idx = get(scope(), 'order').indexOf(h);
  moveWidget(h, idx + (e.key === 'ArrowUp' ? -1 : 1));
  document.getElementById('handle-' + h)?.focus();
});
let dragId = null;
document.addEventListener('dragstart', e => {
  const li = e.target.closest && e.target.closest('.wrow'); if (!li) return;
  dragId = li.dataset.wid; li.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragId);
});
document.addEventListener('dragover', e => {
  const li = e.target.closest && e.target.closest('.wrow'); if (!li || !dragId) return;
  e.preventDefault();
  document.querySelectorAll('.wrow').forEach(r => r.classList.remove('drop-before', 'drop-after'));
  const r = li.getBoundingClientRect();
  li.classList.add(e.clientY < r.top + r.height / 2 ? 'drop-before' : 'drop-after');
});
document.addEventListener('drop', e => {
  const li = e.target.closest && e.target.closest('.wrow'); if (!li || !dragId) return;
  e.preventDefault();
  const order = get(scope(), 'order');
  const after = li.classList.contains('drop-after');
  let to = order.indexOf(li.dataset.wid) + (after ? 1 : 0);
  if (order.indexOf(dragId) < to) to--;
  const id = dragId; dragId = null;
  if (!moveWidget(id, to)) render(true);
});
document.addEventListener('dragend', () => {
  dragId = null;
  document.querySelectorAll('.wrow').forEach(r => r.classList.remove('dragging', 'drop-before', 'drop-after'));
});

render();
</script>
</body>
</html>
